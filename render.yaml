# For persistent hosted data, create PostgreSQL separately and configure DATABASE_URL
# in the Render service Environment (use the database's Internal Database URL).
# Never commit database credentials. Configure DATABASE_URL in Render before deployment.
services:
  - type: web
    name: biosim-lab-pro
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
