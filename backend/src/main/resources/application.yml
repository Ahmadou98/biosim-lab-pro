spring:
  application:
    name: biosim-lab-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./biosimlab;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /dev/h2-console
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
